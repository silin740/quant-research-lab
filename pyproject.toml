[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-lab"
version = "0.1.0"
description = "Causal daily-bar strategy research with explicit execution accounting"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.32,<2", "pandas>=2,<3"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]
